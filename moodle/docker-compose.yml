# Tenant A Moodle — port 8085
name: moodle

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
      POSTGRES_DB: moodle
    volumes:
      - moodle_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 5s
      timeout: 5s
      retries: 20

  moodle:
    image: erseco/alpine-moodle:latest
    ports:
      - "8085:8080"
    environment:
      SITE_URL: http://localhost:8085
      # Published host port 8085 maps to container 8080 — without this Moodle loops on wwwroot mismatch
      REVERSEPROXY: "true"
      DB_TYPE: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASS: moodle
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: Admin@12345
      MOODLE_EMAIL: admin@example.com
      MOODLE_SITE_FULLNAME: EdVidura Dev Moodle
      MOODLE_SITE_SHORTNAME: EdVidura
      # Used by polish_demo.php when re-applied
      EDVIDURA_MOODLE_FULLNAME: EdVidura Dev Moodle
      EDVIDURA_MOODLE_SHORTNAME: EdVidura
    volumes:
      - moodledata:/var/www/moodledata
      - moodlehtml:/var/www/html
      # EdVidura Boost child theme (amber/navy — matches LTI shell)
      # Moodle 5.x serves themes from public/theme
      - ./themes/edvidura:/var/www/html/public/theme/edvidura:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  moodle_db:
  moodledata:
  moodlehtml:
