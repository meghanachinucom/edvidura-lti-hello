# Config for the Moodle service only (deploy with --path-as-root from ./moodle).
# Do not use the repo-root railway.toml here — that health-checks /health for FastAPI.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/login/index.php"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
