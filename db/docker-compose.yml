# EdVidura shared Postgres (multi-tenant spike) + optional Metabase BI
# + optional Yet Analytics SQL LRS
services:
  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: edvidura
      POSTGRES_PASSWORD: edvidura
      POSTGRES_DB: edvidura
    volumes:
      - edvidura_pg:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edvidura -d edvidura"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional BI — http://localhost:3001
  # Data source: Host=db Port=5432 DB=edvidura User=edvidura_bi Password=edvidura_bi
  # (apply db/migration_xapi_tiers.sql first for the BI role + views)
  metabase:
    image: metabase/metabase:v0.52.14
    ports:
      - "3001:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: UTC
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - bi

  # Optional Yet Analytics SQL LRS (SQLite) — http://localhost:8080/admin
  # App env:
  #   XAPI_LRS_PROVIDER=yet
  #   XAPI_LRS_ENDPOINT=http://localhost:8080/xapi
  #   XAPI_LRS_KEY=edvidura_key
  #   XAPI_LRS_SECRET=edvidura_secret
  # Docs: https://yetanalytics.github.io/lrsql/
  yet-lrs:
    image: yetanalytics/lrsql:latest
    ports:
      - "8080:8080"
    environment:
      LRSQL_API_KEY_DEFAULT: edvidura_key
      LRSQL_API_SECRET_DEFAULT: edvidura_secret
      LRSQL_ADMIN_USER_DEFAULT: edvidura_admin
      LRSQL_ADMIN_PASS_DEFAULT: EdViduraAdmin1!
      LRSQL_DB_NAME: db/lrsql.sqlite.db
      LRSQL_ALLOW_ALL_ORIGINS: "true"
    volumes:
      - yet_lrs_data:/lrsql/db
    profiles:
      - lrs

volumes:
  edvidura_pg:
  metabase_data:
  yet_lrs_data:
