# Keycloak (ops identity) — optional profile
# Start: docker compose -f identity/docker-compose.yml up -d
# Console: http://localhost:8087 (admin / admin)
# Realm import: edvidura (ops user ops@edvidura.local / OpsPass123!)
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    ports:
      - "8087:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./realm-edvidura.json:/opt/keycloak/data/import/realm-edvidura.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  keycloak_data:
