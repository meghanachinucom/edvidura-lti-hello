name: Tenant isolation

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

jobs:
  isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edvidura
          POSTGRES_PASSWORD: edvidura
          POSTGRES_DB: edvidura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edvidura -d edvidura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://edvidura_app:edvidura_app@127.0.0.1:5432/edvidura

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply schema (owner) then seed
        env:
          # Owner role creates edvidura_app + RLS; app role used for tests below.
          DATABASE_URL: postgresql://edvidura:edvidura@127.0.0.1:5432/edvidura
          MIGRATE_STRICT: "1"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          python scripts/apply_migrations.py
          python scripts/seed_schools.py

      - name: Run isolation + unit tests
        env:
          REQUIRE_DB: "1"
          ENVIRONMENT: development
          ADMIN_API_KEY: test-admin-key
          SESSION_SECRET: ci-session-secret-not-for-prod
          # Avoid cross-test rate-limit pollution via shared LAUNCH_CACHE.
          RATE_LIMIT_ENABLED: "0"
          DATABASE_URL: postgresql://edvidura_app:edvidura_app@127.0.0.1:5432/edvidura
        run: pytest -q tests/
