<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>EdVidura owner login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0e2b24;
      --card: #f7faf8;
      --ink: #0e2b24;
      --muted: #5f6f68;
      --accent: #0e7a5c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Outfit, system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1a4a3c, var(--bg));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      background: var(--card);
      color: var(--ink);
      border-radius: 20px;
      padding: 28px 26px;
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }
    .brand {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.02em;
      margin: 0 0 4px;
    }
    .lede { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.45; }
    label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid rgba(14,43,36,.14);
      font: inherit;
      margin-bottom: 14px;
    }
    button, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .err {
      background: rgba(186,26,26,.1);
      color: #ba1a1a;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .alt { margin-top: 14px; text-align: center; font-size: 13px; color: var(--muted); }
    .alt a { color: var(--accent); font-weight: 650; }
  </style>
</head>
<body>
  <div class="card">
    <p class="brand">EdVidura · Owners</p>
    <p class="lede">
      Platform console for Metabase charts and Yet learning history.
      Schools and teachers do not use this login.
    </p>
    {% if err %}
    <div class="err">{{ err }}</div>
    {% endif %}
    <form method="post" action="/ops/login">
      <label for="admin_key">Owner key</label>
      <input id="admin_key" name="admin_key" type="password" required autocomplete="current-password" placeholder="ADMIN_API_KEY"/>
      <button type="submit">Sign in</button>
    </form>
    {% if keycloak_enabled %}
    <p class="alt"><a href="/auth/login?next=/ops/dashboard">Sign in with Keycloak</a></p>
    {% endif %}
    <p class="alt"><a href="/">← Back to EdVidura</a></p>
  </div>
</body>
</html>
