<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="xrBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b172e"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="line3d" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#xrBg1)"/>

  <!-- Isometric 3D Grid Plane (Z=0) -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.8">
    <!-- Isometric Transversal Lines -->
    <path d="M 600 200 L 1050 460 L 600 620 L 150 460 Z" fill="#0f172a" fill-opacity="0.7" stroke="#334155" stroke-width="2"/>
    <line x1="240" y1="430" x2="690" y2="590"/>
    <line x1="330" y1="400" x2="780" y2="560"/>
    <line x1="420" y1="370" x2="870" y2="530"/>
    <line x1="510" y1="340" x2="960" y2="500"/>

    <line x1="690" y1="230" x2="240" y2="390"/>
    <line x1="780" y1="260" x2="330" y2="420"/>
    <line x1="870" y1="290" x2="420" y2="450"/>
    <line x1="960" y1="320" x2="510" y2="480"/>
  </g>

  <!-- 3D Axes: X (red/amber), Y (green), Z (blue/cyan) originating from Center (600, 460) -->
  <g>
    <!-- Origin marker -->
    <circle cx="600" cy="460" r="5" fill="#f8fafc"/>
    <text x="590" y="485" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" font-weight="bold">(0,0,0)</text>

    <!-- X Axis (Isometric Left Down) -->
    <line x1="600" y1="460" x2="200" y2="600" stroke="#f43f5e" stroke-width="3" filter="url(#neon)"/>
    <text x="180" y="615" font-family="system-ui, sans-serif" font-size="20" fill="#f43f5e" font-weight="bold">+X Axis</text>

    <!-- Y Axis (Isometric Right Down) -->
    <line x1="600" y1="460" x2="1000" y2="600" stroke="#10b981" stroke-width="3" filter="url(#neon)"/>
    <text x="1010" y="615" font-family="system-ui, sans-serif" font-size="20" fill="#10b981" font-weight="bold">+Y Axis</text>

    <!-- Z Axis (Upwards Vertical) -->
    <line x1="600" y1="460" x2="600" y2="100" stroke="#38bdf8" stroke-width="3.5" filter="url(#neon)"/>
    <text x="615" y="115" font-family="system-ui, sans-serif" font-size="20" fill="#38bdf8" font-weight="bold">+Z Axis (Elevation)</text>
  </g>

  <!-- Floating 3D Vector & Delta Prism -->
  <g filter="url(#neon)">
    <!-- 3D Vector Ray -->
    <line x1="360" y1="520" x2="840" y2="240" stroke="url(#line3d)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Coordinate Nodes -->
    <circle cx="360" cy="520" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="840" cy="240" r="9" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Projection lines to grid plane -->
    <line x1="840" y1="240" x2="840" y2="400" stroke="#38bdf8" stroke-dasharray="6 6" stroke-width="2"/>
    <circle cx="840" cy="400" r="4" fill="#38bdf8"/>
    
    <!-- Delta slope triangle -->
    <polygon points="360,520 840,520 840,240" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-dasharray="4 4" stroke-width="2"/>
  </g>

  <!-- Floating Spatial Hologram HUD overlay -->
  <g transform="translate(80, 70)">
    <rect width="360" height="90" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="24" y="34" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8" font-weight="bold" letter-spacing="1">
      SPATIAL CARTESIAN ENGINE · 3D WEBXR
    </text>
    <text x="24" y="65" font-family="monospace" font-size="22" fill="#f8fafc" font-weight="bold">
      V⃗ = 4.2 î + 6.8 ĵ + 5.0 k̂
    </text>
  </g>

  <g transform="translate(820, 70)">
    <rect width="300" height="75" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="12" fill="#f59e0b" font-weight="bold" letter-spacing="1">
      SLOPE &amp; ANGLE OF ELEVATION
    </text>
    <text x="20" y="58" font-family="monospace" font-size="20" fill="#f8fafc" font-weight="bold">
      m = 1.50 · θ = 56.3°
    </text>
  </g>
</svg>
