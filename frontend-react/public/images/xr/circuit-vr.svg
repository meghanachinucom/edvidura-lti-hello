<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="vrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051923"/>
      <stop offset="50%" stop-color="#003554"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <linearGradient id="traceGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a6fb"/>
      <stop offset="100%" stop-color="#0582ca"/>
    </linearGradient>
    <filter id="circuitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#vrBg)"/>

  <!-- Isometric Lab Workbench Table -->
  <g stroke="#006494" stroke-width="1.5">
    <!-- Table surface -->
    <path d="M 600 240 L 1060 480 L 600 630 L 140 480 Z" fill="#001d3d" stroke="#00a6fb" stroke-width="2"/>
    
    <!-- Breadboard base in isometric 3D -->
    <path d="M 600 310 L 880 450 L 600 540 L 320 450 Z" fill="#ffffff" fill-opacity="0.9" stroke="#94a3b8" stroke-width="2"/>
    <!-- Breadboard pin row tracks -->
    <line x1="390" y1="440" x2="600" y2="340" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="450" y1="460" x2="600" y2="390" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="600" y1="340" x2="810" y2="440" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="600" y1="390" x2="750" y2="460" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Glowing Resistors & LED Components on Board -->
  <g transform="translate(480, 360)" filter="url(#circuitGlow)">
    <!-- 3D Cylindrical Resistor 1 -->
    <rect x="20" y="20" width="80" height="24" rx="10" fill="#fed7aa" stroke="#78350f" stroke-width="1.5"/>
    <!-- Color Bands (Yellow, Violet, Brown, Gold: 470Ω) -->
    <rect x="35" y="20" width="6" height="24" fill="#eab308"/>
    <rect x="48" y="20" width="6" height="24" fill="#a855f7"/>
    <rect x="61" y="20" width="6" height="24" fill="#78350f"/>
    <rect x="80" y="20" width="6" height="24" fill="#facc15"/>
    <!-- Wire leads -->
    <line x1="5" y1="32" x2="20" y2="32" stroke="#94a3b8" stroke-width="3"/>
    <line x1="100" y1="32" x2="115" y2="32" stroke="#94a3b8" stroke-width="3"/>

    <!-- Glowing Green LED -->
    <circle cx="150" cy="30" r="14" fill="#22c55e" stroke="#86efac" stroke-width="2"/>
    <circle cx="150" cy="30" r="24" fill="#22c55e" fill-opacity="0.25"/>
  </g>

  <!-- Isometric Digital Multimeter (Right Side) -->
  <g transform="translate(820, 220)">
    <!-- Multimeter Body -->
    <path d="M 40 80 L 180 150 L 180 340 L 40 270 Z" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <path d="M 40 80 L 180 150 L 250 110 L 110 40 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <path d="M 180 150 L 250 110 L 250 300 L 180 340 Z" fill="#a16207" stroke="#ca8a04" stroke-width="2"/>

    <!-- LCD Display Screen -->
    <path d="M 65 110 L 155 155 L 155 205 L 65 160 Z" fill="#0f172a" stroke="#000000" stroke-width="1.5"/>
    <text x="75" y="155" font-family="'Courier New', monospace" font-size="22" fill="#38bdf8" font-weight="bold">
      12.00 V
    </text>

    <!-- Dial Selector -->
    <circle cx="110" cy="230" r="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <line x1="110" y1="230" x2="110" y2="215" stroke="#ffffff" stroke-width="3"/>

    <!-- Probe Wires -->
    <path d="M 110 320 Q 90 400 30 420" fill="none" stroke="#ef4444" stroke-width="4"/>
    <path d="M 130 325 Q 110 420 -30 430" fill="none" stroke="#000000" stroke-width="4"/>
  </g>

  <!-- Left Side: Ohm's Law Formula Card -->
  <g transform="translate(80, 80)">
    <rect width="360" height="120" rx="16" fill="#031d44" fill-opacity="0.9" stroke="#00a6fb" stroke-width="2"/>
    <text x="24" y="34" font-family="system-ui, sans-serif" font-size="12" fill="#00a6fb" font-weight="bold">
      OHM'S LAW VR SIMULATION ENGINE
    </text>
    <text x="24" y="68" font-family="monospace" font-size="26" fill="#ffffff" font-weight="bold">
      V = I × R
    </text>
    <text x="24" y="98" font-family="system-ui, sans-serif" font-size="14" fill="#93c5fd">
      Voltage: 12.0 V · Current: 25.5 mA · Resistance: 470 Ω
    </text>
  </g>
</svg>
