<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2942" />
      <stop offset="100%" stop-color="#091d30" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Rounded navy/teal badge -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" stroke="#1e476d" stroke-width="3" />
  
  <!-- Academic Mortarboard Cap / Emblem in warm gold -->
  <g transform="translate(64, 40)">
    <!-- Mortarboard rhombus -->
    <path d="M 0 -18 L 36 -6 L 0 6 L -36 -6 Z" fill="url(#gold)" />
    <!-- Cap skullcap underside -->
    <path d="M -22 -1 L -22 9 C -22 18, 22 18, 22 9 L 22 -1 C 16 5, -16 5, -22 -1 Z" fill="#d97706" />
    <!-- Tassel -->
    <path d="M 28 -3 L 34 8 L 34 16" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="34" cy="18" r="2.5" fill="#f59e0b" />
    <!-- Center button -->
    <circle cx="0" cy="-6" r="2.5" fill="#fef3c7" />
  </g>
  
  <!-- Bold white "EV" monogram -->
  <text x="64" y="98" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">EV</text>
  
  <!-- Subtle gold accent dot -->
  <circle cx="96" cy="94" r="3.5" fill="#f59e0b" />
</svg>
