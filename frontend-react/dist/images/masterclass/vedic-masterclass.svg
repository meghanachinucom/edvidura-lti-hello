<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="vedicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="50%" stop-color="#28114b"/>
      <stop offset="100%" stop-color="#0c0418"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#vedicBg)"/>

  <!-- Geometric Mandala / Sacred Geometry Background Grid -->
  <g stroke="#6b21a8" stroke-width="0.8" opacity="0.35">
    <circle cx="640" cy="360" r="320" fill="none"/>
    <circle cx="640" cy="360" r="240" fill="none"/>
    <circle cx="640" cy="360" r="160" fill="none"/>
    <polygon points="640,40 917,520 363,520" fill="none"/>
    <polygon points="640,680 917,200 363,200" fill="none"/>
  </g>

  <!-- Left: Vedic Sutra & Rapid Cross-Multiplication Diagram -->
  <g transform="translate(100, 130)">
    <rect width="520" height="420" rx="20" fill="#1e1035" stroke="#7e22ce" stroke-width="2"/>
    <text x="40" y="55" font-family="system-ui, sans-serif" font-size="20" fill="#fbbf24" font-weight="bold">
      SUTRA: URDHVA TIRYAGBHYAM
    </text>
    <text x="40" y="85" font-family="system-ui, sans-serif" font-size="14" fill="#c084fc">
      Vertically and Crosswise Multiplication
    </text>

    <!-- Cross Multiplication Heuristic Diagram -->
    <g transform="translate(60, 110)">
      <!-- Numbers: 94 x 97 -->
      <text x="60" y="60" font-family="'Courier New', monospace" font-size="44" fill="#ffffff" font-weight="bold">9 4</text>
      <text x="18" y="130" font-family="'Courier New', monospace" font-size="44" fill="#f59e0b" font-weight="bold">×</text>
      <text x="60" y="130" font-family="'Courier New', monospace" font-size="44" fill="#ffffff" font-weight="bold">9 7</text>
      
      <!-- Base 100 Deficits -->
      <g transform="translate(180, 0)">
        <text x="20" y="60" font-family="'Courier New', monospace" font-size="34" fill="#f87171" font-weight="bold">− 06</text>
        <text x="20" y="130" font-family="'Courier New', monospace" font-size="34" fill="#f87171" font-weight="bold">− 03</text>
        <!-- Cross arrow indicators -->
        <line x1="5" y1="50" x2="-35" y2="120" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>
        <line x1="5" y1="120" x2="-35" y2="50" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4"/>
      </g>

      <line x1="10" y1="160" x2="380" y2="160" stroke="#7e22ce" stroke-width="2"/>

      <!-- Result Breakup -->
      <text x="40" y="210" font-family="'Courier New', monospace" font-size="36" fill="#38bdf8" font-weight="bold">
        (94 − 3) | (−6 × −3)
      </text>
      <text x="90" y="260" font-family="'Courier New', monospace" font-size="44" fill="#4ade80" font-weight="bold">
        = 91 | 18 = 9118
      </text>
    </g>
  </g>

  <!-- Right: 2D/3D Parabolic Quadratic Heuristic -->
  <g transform="translate(680, 130)">
    <rect width="500" height="420" rx="20" fill="#1e1035" stroke="#7e22ce" stroke-width="2"/>
    <text x="40" y="55" font-family="system-ui, sans-serif" font-size="20" fill="#38bdf8" font-weight="bold">
      ANURUPYENA · FACTORIZATION GEOMETRY
    </text>
    <text x="40" y="85" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">
      Proportional roots &amp; Quadratic curve symmetry
    </text>

    <!-- Parabola SVG -->
    <g transform="translate(40, 110)">
      <!-- Axes -->
      <line x1="20" y1="180" x2="400" y2="180" stroke="#64748b" stroke-width="2"/>
      <line x1="210" y1="10" x2="210" y2="250" stroke="#64748b" stroke-width="2"/>
      
      <!-- Parabolic Curve y = ax^2 + bx + c -->
      <path d="M 60 30 Q 210 240 360 30" fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#purpleGlow)"/>
      <circle cx="110" cy="180" r="5" fill="#f87171"/>
      <circle cx="310" cy="180" r="5" fill="#4ade80"/>
      <text x="80" y="205" font-family="monospace" font-size="14" fill="#f87171" font-weight="bold">r₁ = -2</text>
      <text x="300" y="205" font-family="monospace" font-size="14" fill="#4ade80" font-weight="bold">r₂ = +4</text>
      <circle cx="210" cy="205" r="4" fill="#fbbf24"/>
      <text x="220" y="235" font-family="monospace" font-size="12" fill="#fbbf24">Vertex (h, k)</text>
    </g>
  </g>

  <!-- Bottom banner -->
  <g transform="translate(100, 590)">
    <rect width="1080" height="60" rx="14" fill="#2d1554" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="40" y="36" font-family="system-ui, sans-serif" font-size="16" fill="#f8fafc" font-weight="600">
      <tspan fill="#fbbf24">MENTAL ALGORITHM:</tspan> Ekadhikena Purvena · Nikhilam Navatashcaramam Dashatah · Anurupyena
    </text>
  </g>
</svg>
